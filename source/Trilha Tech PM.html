document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"46cf9498-0536-4658-b1bf-9201ff0cb66f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box}\n  body{margin:0;background:#F5F6FA;color:#191B28;font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-wrap:pretty;font-variant-numeric:tabular-nums}\n  a{color:#5251C9;text-decoration:none}\n  a:hover{color:#3F3EA8;text-decoration:underline}\n  input,select,textarea,button{font-family:inherit}\n  ::selection{background:#E2E2FB}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#F5F6FA\">\n\n<header style=\"position:sticky;top:0;z-index:20;background:rgba(245,246,250,.85);backdrop-filter:blur(12px);border-bottom:1px solid #EBECF2\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:12px clamp(16px,4vw,36px);display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-right:auto\">\n      <span style=\"width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#6C6CE8,#8A6FE4);display:block\"><\u002Fspan>\n      <span style=\"font-size:16px;font-weight:700;letter-spacing:-.02em\">Trilha Tech PM<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:4px;flex-wrap:wrap\" aria-label=\"Seções\">\n      <sc-for list=\"{{ nav }}\" as=\"it\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ it.go }}\" style=\"{{ it.style }}\">{{ it.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <button sc-camel-on-click=\"{{ goAjustes }}\" style=\"background:none;border:0;padding:9px 12px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;color:#8C90A0\" style-hover=\"color:#191B28\">Ajustes<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width:1160px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(16px,4vw,36px) 110px\">\n\n  <sc-if value=\"{{ isPainel }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <section style=\"position:relative;overflow:hidden;border-radius:26px;padding:clamp(28px,4vw,40px);background:linear-gradient(135deg,#6C6CE8 0%,#5B5BD6 48%,#8A6FE4 100%);color:#fff\">\n        <div style=\"display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between\">\n          <div style=\"max-width:560px\">\n            <span style=\"display:inline-block;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\">{{ eyebrow }}<\u002Fspan>\n            <h1 style=\"margin:16px 0 0;font-size:clamp(28px,3.6vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.1\">{{ title }}<\u002Fh1>\n            <p style=\"margin:12px 0 0;font-size:16.5px;line-height:1.55;color:rgba(255,255,255,.82)\">{{ sub }}<\u002Fp>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:26px\">\n              <button sc-camel-on-click=\"{{ goFocusWeek }}\" style=\"border:0;background:#fff;color:#4F4CC4;border-radius:999px;padding:12px 22px;font-size:14.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0F0FF\">{{ ctaLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goSemanas }}\" style=\"border:1px solid rgba(255,255,255,.45);background:none;color:#fff;border-radius:999px;padding:12px 22px;font-size:14.5px;font-weight:600;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.14)\">Ver a trilha<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <div style=\"{{ ringStyle }}\">\n              <div style=\"position:absolute;inset:9px;border-radius:50%;background:#6262DC;display:grid;place-items:center;text-align:center\">\n                <div>\n                  <div style=\"font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1\">{{ overallPct }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;font-weight:500;color:rgba(255,255,255,.7);margin-top:3px\">concluído<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.18)\">\n          <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px\">\n            <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n              <button sc-camel-on-click=\"{{ c.go }}\" title=\"{{ c.title }}\" style=\"{{ c.style }}\">{{ c.n }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px\">\n            <sc-for list=\"{{ phaseLabels }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <span style=\"font-size:11.5px;font-weight:500;color:rgba(255,255,255,.65)\">{{ p.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px\">\n        <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border:1px solid #EDEEF4;border-radius:20px;padding:20px 22px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n              <span style=\"font-size:13.5px;font-weight:500;color:#7A7F90\">{{ st.l }}<\u002Fspan>\n              <span style=\"{{ st.badge }}\">{{ st.v }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;height:6px;border-radius:3px;background:#F0F1F6;overflow:hidden\"><span style=\"{{ st.fill }}\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:14px;align-items:start\">\n        <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:24px 26px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n            <h2 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em\">{{ focusLabel }}<\u002Fh2>\n            <span style=\"font-size:13px;color:#8C90A0\">{{ focusRange }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:14.5px;color:#6B7080\">{{ focusGoal }}<\u002Fp>\n          <div style=\"margin-top:14px\">\n            <sc-for list=\"{{ focusTasks }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div style=\"display:grid;grid-template-columns:24px 1fr;gap:14px;padding:16px 0;border-top:1px solid #F1F2F7;align-items:start\">\n                <button sc-camel-on-click=\"{{ t.cycle }}\" title=\"{{ t.statusLabel }}\" aria-label=\"{{ t.statusLabel }}\" style=\"{{ t.dot }}\"><sc-if value=\"{{ t.done }}\"><span style=\"font-size:12px;font-weight:700;color:#fff;line-height:1\">✓<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n                <div>\n                  <div style=\"{{ t.titleStyle }}\">{{ t.title }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px\">\n                    <span style=\"{{ t.tagStyle }}\">{{ t.type }}<\u002Fspan>\n                    <sc-if value=\"{{ t.hasUrl }}\"><a href=\"{{ t.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:500\">{{ t.res }} ↗<\u002Fa><\u002Fsc-if>\n                    <span style=\"font-size:13px;color:#9498A8\">{{ t.hPrev }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ showHours }}\">\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px\">\n                      <input type=\"number\" step=\"0.5\" min=\"0\" placeholder=\"horas\" value=\"{{ t.hours }}\" sc-camel-on-change=\"{{ t.onHours }}\" aria-label=\"Horas realizadas\" style=\"width:82px;border:1px solid #E7E8EF;border-radius:10px;padding:7px 10px;font-size:13px;background:#FAFAFD;color:#191B28\">\n                      <input type=\"url\" placeholder=\"link da evidência\" value=\"{{ t.link }}\" sc-camel-on-change=\"{{ t.onLink }}\" aria-label=\"Link da evidência\" style=\"flex:1;min-width:150px;border:1px solid #E7E8EF;border-radius:10px;padding:7px 10px;font-size:13px;background:#FAFAFD;color:#191B28\">\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showWorkPrompt }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:18px;padding:16px 18px;background:#F6F6FD;border-radius:16px;font-size:14px;color:#585C6C;line-height:1.55\">\n              <span style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8A8DE0;margin-bottom:6px\">Leve para o trabalho<\u002Fspan>\n              {{ focusWork }}\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:22px 24px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n            <h2 style=\"margin:0 0 16px;font-size:15px;font-weight:700;letter-spacing:-.01em\">Fases<\u002Fh2>\n            <sc-for list=\"{{ phaseBars }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"margin-bottom:16px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px\"><span style=\"font-size:13.5px;color:#4C5162\">{{ p.name }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#9498A8\">{{ p.count }}<\u002Fspan><\u002Fdiv>\n                <div style=\"height:6px;border-radius:3px;background:#F0F1F6;overflow:hidden\"><span style=\"{{ p.fill }}\"><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:22px 24px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n            <h2 style=\"margin:0 0 16px;font-size:15px;font-weight:700;letter-spacing:-.01em\">Projetos<\u002Fh2>\n            <sc-for list=\"{{ projBars }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <div style=\"margin-bottom:16px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px\"><span style=\"font-size:13.5px;color:#4C5162\">{{ p.repo }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#9498A8\">{{ p.count }}<\u002Fspan><\u002Fdiv>\n                <div style=\"height:6px;border-radius:3px;background:#F0F1F6;overflow:hidden\"><span style=\"{{ p.fill }}\"><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:22px 24px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n            <h2 style=\"margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:-.01em\">Autoavaliação<\u002Fh2>\n            <p style=\"margin:0 0 14px;font-size:13.5px;color:#7A7F90\">{{ ckSummary }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ goChecklist }}\" style=\"border:1px solid #E7E8 div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start\">\n        <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:24px 26px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n              <h2 style=\"margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em\">{{ p.repo }}<\u002Fh2>\n              <span style=\"{{ p.badge }}\">{{ p.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:8px 0 16px;font-size:14px;color:#6B7080\">{{ p.proves }}<\u002Fp>\n            <div style=\"height:6px;border-radius:3px;background:#F0F1F6;overflow:hidden\"><span style=\"{{ p.fill }}\"><\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:6px\">\n              <sc-for list=\"{{ p.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:20px 1fr;gap:12px;padding:13px 0;border-top:1px solid #F1F2F7;align-items:start\">\n                  <input type=\"checkbox\" checked=\"{{ i.done }}\" sc-camel-on-change=\"{{ i.toggle }}\" aria-label=\"{{ i.t }}\" style=\"width:17px;height:17px;margin-top:3px;accent-color:#5B5BD6;cursor:pointer\">\n                  <div>\n                    <div style=\"{{ i.labelStyle }}\">{{ i.t }}<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:#A0A4B2;margin-top:2px\">semana {{ i.w }}<\u002Fdiv>\n                    <sc-if value=\"{{ showHours }}\">\n                      <input type=\"url\" placeholder=\"link\" value=\"{{ i.link }}\" sc-camel-on-change=\"{{ i.onLink }}\" aria-label=\"Link da evidência\" style=\"width:100%;margin-top:8px;border:1px solid #E7E8EF;border-radius:10px;padding:6px 10px;font-size:12.5px;background:#FAFAFD;color:#191B28\">\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRecursos }}\">\n    <div>\n      <h1 style=\"margin:8px 0 0;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.03em\">Recursos<\u002Fh1>\n      <p style=\"margin:8px 0 26px;color:#6B7080;max-width:540px\">Dezessete materiais gratuitos, na ordem em que entram na trilha.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start\">\n        <sc-for list=\"{{ resGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n          <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:22px 24px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n            <h2 style=\"margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em\">{{ g.skill }}<\u002Fh2>\n            <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #F1F2F7;margin-top:14px\">\n                <div>\n                  <a href=\"{{ r.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14.5px;font-weight:600\">{{ r.name }}<\u002Fa>\n                  <div style=\"font-size:12.5px;color:#A0A4B2;margin-top:3px\">{{ r.when }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-raw-select value=\"{{ r.status }}\" sc-camel-on-change=\"{{ r.onChange }}\" aria-label=\"Status do recurso\" style=\"{{ r.style }}\">\n                  <option>Não iniciado<\u002Foption>\n                  <option>Em uso<\u002Foption>\n                  <option>Concluído<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showReserve }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"margin-top:30px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em\">Reserva<\u002Fh2>\n          <p style=\"margin:6px 0 14px;font-size:14px;color:#7A7F90\">Fora das 12 semanas. Use só quando um item específico pedir.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px\">\n            <sc-for list=\"{{ reserve }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff;border:1px solid #EDEEF4;border-radius:18px;padding:16px 18px\">\n                <a href=\"{{ r.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14px;font-weight:600\">{{ r.name }}<\u002Fa>\n                <div style=\"font-size:13px;color:#8C90A0;margin-top:5px\">{{ r.why }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isChecklist }}\">\n    <div>\n      <h1 style=\"margin:8px 0 0;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.03em\">Autoavaliação<\u002Fh1>\n      <p style=\"margin:8px 0 22px;color:#6B7080;max-width:560px\">Responda Sim só para o que você consegue fazer hoje, sem preparação. Refaça nas semanas 0, 4, 8 e 12.<\u002Fp>\n\n      <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:22px 26px;box-shadow:0 1px 2px rgba(25,27,40,.04);display:flex;align-items:center;gap:26px;flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:center;gap:16px\">\n          <div style=\"{{ ckRingStyle }}\">\n            <div style=\"position:absolute;inset:8px;border-radius:50%;background:#fff;display:grid;place-items:center\">\n              <span style=\"font-size:19px;font-weight:700;letter-spacing:-.02em\">{{ ckPct }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:15px;font-weight:600\">{{ ckColLabel }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#8C90A0\">meta de 80% na semana 12<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;background:#F4F5F9;padding:4px;border-radius:999px\">\n          <sc-for list=\"{{ ckTabs }}\" as=\"tb\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ tb.go }}\" style=\"{{ tb.style }}\">{{ tb.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ ckItems }}\" as=\"it\" hint-placeholder-count=\"10\">\n          <div style=\"background:#fff;border:1px solid #EDEEF4;border-radius:18px;padding:16px 20px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n            <span style=\"font-size:14.5px;max-width:560px\">{{ it.item }}<\u002Fspan>\n            <div style=\"display:flex;gap:4px;background:#F4F5F9;padding:4px;border-radius:999px\">\n              <sc-for list=\"{{ it.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-top:18px;padding:0 4px\">\n        <sc-for list=\"{{ ckHistory }}\" as=\"h\" hint-placeholder-count=\"4\">\n          <span style=\"font-size:13px;color:#8C90A0\">{{ h.label }}: <b style=\"color:#191B28;font-weight:600\">{{ h.pct }}<\u002Fb><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAjustes }}\">\n    <div style=\"max-width:620px\">\n      <h1 style=\"margin:8px 0 0;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.03em\">Ajustes<\u002Fh1>\n      <p style=\"margin:8px 0 24px;color:#6B7080\">Seu progresso fica salvo neste navegador. Exporte um backup antes de trocar de máquina.<\u002Fp>\n      <section style=\"background:#fff;border:1px solid #EDEEF4;border-radius:22px;padding:24px 26px;display:grid;gap:20px;box-shadow:0 1px 2px rgba(25,27,40,.04)\">\n        <label style=\"display:grid;gap:8px;font-size:14px;font-weight:600\">Data de início (segunda-feira)\n          <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ onStart }}\" style=\"border:1px solid #E7E8EF;border-radius:12px;padding:10px 12px;font-size:14px;background:#FAFAFD;color:#191B28;font-weight:400\">\n        <\u002Flabel>\n        <label style=\"display:grid;gap:8px;font-size:14px;font-weight:600\">Meta de horas por semana\n          <input type=\"number\" min=\"1\" max=\"40\" step=\"0.5\" value=\"{{ goal }}\" sc-camel-on-change=\"{{ onGoal }}\" style=\"border:1px solid #E7E8EF;border-radius:12px;padding:10px 12px;font-size:14px;background:#FAFAFD;color:#191B28;font-weight:400\">\n        <\u002Flabel>\n        <div>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <button sc-camel-on-click=\"{{ onExport }}\" style=\"border:0;background:#5B5BD6;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#4F4CC4\">Copiar backup<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onImport }}\" style=\"border:1px solid #E7E8EF;background:#FAFAFD;color:#191B28;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#F1F2F7\">Restaurar do texto<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onReset }}\" style=\"border:1px solid #F3DEDB;background:#FDF7F6;color:#B4483A;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#FBEEEC\">Apagar progresso<\u002Fbutton>\n          <\u002Fdiv>\n          <textarea placeholder=\"Cole aqui um backup para restaurar\" value=\"{{ jsonText }}\" sc-camel-on-change=\"{{ onJson }}\" style=\"width:100%;min-height:110px;margin-top:12px;resize:vertical;border:1px solid #E7E8EF;border-radius:14px;padding:12px 14px;font-family:ui-monospace,monospace;font-size:12px;background:#FAFAFD;color:#191B28\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <p style=\"margin:16px 0 0;font-size:13.5px;color:#8C90A0;line-height:1.6\">Para publicar: suba o arquivo como <b style=\"font-weight:600\">index.html<\u002Fb> num repositório e ative o GitHub Pages em Settings › Pages.<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:12.5px;color:#A0A4B2\">{{ savedAt }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fmain>\n\n<sc-if value=\"{{ toast }}\">\n  <div role=\"status\" aria-live=\"polite\" style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#191B28;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:50;box-shadow:0 8px 24px rgba(25,27,40,.18)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showHours&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;showWorkPrompt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;showReserve&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nclass Component extends DCLogic {\n  KEY = \"trilha-tech-pm-v1\";\n  DAY = 86400000;\n  STATUS = [\"Não iniciado\", \"Em andamento\", \"Concluído\"];\n  PLAN = {\n    phases: [\n      {n:1, name:\"Fase 1 · Fundamentos\", weeks:[1,2,3,4]},\n      {n:2, name:\"Fase 2 · APIs, IA e cloud\", weeks:[5,6,7,8]},\n      {n:3, name:\"Fase 3 · Construir e publicar\", weeks:[9,10,11,12]},\n    ],\n    weeks: [\n      {n:1, phase:1, focus:\"Git, GitHub e pipeline\", goal:\"Repositório system-design-notebook criado e README de perfil no GitHub.\", work:\"Abra o repositório do produto que você gerencia e leia o último PR mesclado. Anote o que não entendeu.\", tasks:[\n        {id:\"t1\", type:\"estudo\", title:\"GitHub Skills: Introduction to GitHub, Review pull requests e Hello GitHub Actions\", res:\"GitHub Skills\", url:\"https://skills.github.com\", h:3},\n        {id:\"t2\", type:\"artefato\", title:\"Criar o repo system-design-notebook e o README de perfil no GitHub\", res:\"GitHub\", url:\"https://github.com\", h:1.5},\n      ]},\n      {n:2, phase:1, focus:\"System design I\", goal:\"3 diagramas Mermaid com um parágrafo de resumo por módulo.\", work:\"Desenhe em 15 minutos a arquitetura do produto que você gerencia hoje: componentes, fluxo de dados, onde está o risco. Mostre a um engenheiro e peça para corrigir.\", tasks:[\n        {id:\"t3\", type:\"estudo\", title:\"freeCodeCamp, Learn Software System Design (parte 1): bancos, escala, load balancing, SPOF\", res:\"freeCodeCamp\", url:\"https://www.freecodecamp.org/news/learn-software-system-design/\", h:2},\n        {id:\"t4\", type:\"artefato\", title:\"Desenhar 3 diagramas Mermaid e resumir cada módulo em um parágrafo\", res:\"Mermaid\", url:\"https://mermaid.js.org\", h:2},\n      ]},\n      {n:3, phase:1, focus:\"System design II e APIs\", goal:\"Design doc #1: encurtador de URL.\", work:\"Leia dois PRs abertos do time. Para cada um, escreva em uma frase o que muda e o que pode quebrar. Peça a um engenheiro para revisar o design doc #1.\", tasks:[\n        {id:\"t5\", type:\"estudo\", title:\"freeCodeCamp (parte 2): API design, REST, GraphQL, autenticação e segurança\", res:\"freeCodeCamp\", url:\"https://www.freecodecamp.org/news/learn-software-system-design/\", h:2},\n        {id:\"t6\", type:\"artefato\", title:\"Design doc #1: encurtador de URL (C4 nível 1 e 2, ADR, estimativa de capacidade)\", res:\"C4 Model\", url:\"https://c4model.com\", h:3},\n      ]},\n      {n:4, phase:1, focus:\"SQL e escrita técnica\", goal:\"Design doc #2: sistema de notificações.\", work:\"Pegue uma pergunta que você faria ao time de dados esta semana e responda você mesmo com SQL. Peça revisão do design doc #2.\", tasks:[\n        {id:\"t7\", type:\"estudo\", title:\"SQLBolt, todas as lições\", res:\"SQLBolt\", url:\"https://sqlbolt.com\", h:2.5},\n        {id:\"t8\", type:\"estudo\", title:\"Google Technical Writing One\", res:\"Google Tech Writing\", url:\"https://developers.google.com/tech-writing\", h:2.5},\n        {id:\"t9\", type:\"artefato\", title:\"Design doc #2: sistema de notificações (filas, retries, canais)\", res:\"ADR\", url:\"https://adr.github.io\", h:2},\n      ]},\n      {n:5, phase:2, focus:\"Contratos de API\", goal:\"Contrato OpenAPI do agente de triagem de tickets (P2).\", work:\"Escolha um endpoint real do produto e compare com o que aprendeu: versionamento, erros, paginação, auth. O que falta?\", tasks:[\n        {id:\"t10\", type:\"estudo\", title:\"OpenAPI Specification com o Swagger Editor\", res:\"Swagger Editor\", url:\"https://editor.swagger.io\", h:2},\n        {id:\"t11\", type:\"artefato\", title:\"Escrever o contrato OpenAPI do agente de triagem de tickets\", res:\"Swagger Editor\", url:\"https://editor.swagger.io\", h:3},\n      ]},\n      {n:6, phase:2, focus:\"Produto de IA I\", goal:\"PRD do agente de triagem com métricas e plano de evals (P2).\", work:\"Liste as features de IA ou automações do produto e responda: como sabemos que funcionam? Que métrica diria que falharam?\", tasks:[\n        {id:\"t12\", type:\"estudo\", title:\"HelloPM, masterclasses de LLMs, RAG e evals\", res:\"HelloPM\", url:\"https://hellopm.co/free/\", h:4},\n        {id:\"t13\", type:\"leitura\", title:\"Your AI Product Needs Evals (Hamel Husain)\", res:\"hamel.dev\", url:\"https://hamel.dev/blog/posts/evals/\", h:0.5},\n        {id:\"t14\", type:\"artefato\", title:\"PRD do agente de triagem: problema, métricas de sucesso, não-objetivos e plano de evals\", res:\"Design Docs at Google\", url:\"https://www.industrialempathy.com/posts/design-docs-at-google/\", h:2.5},\n      ]},\n      {n:7, phase:2, focus:\"Produto de IA II\", goal:\"Protótipo do agente de triagem rodando local (P4).\", work:\"Mostre o protótipo a um engenheiro ou ao time de suporte e pergunte o que quebraria com tickets reais.\", tasks:[\n        {id:\"t15\", type:\"estudo\", title:\"Microsoft Generative AI for Beginners, lições de RAG e agentes\", res:\"GenAI for Beginners\", url:\"https://github.com/microsoft/generative-ai-for-beginners\", h:3},\n        {id:\"t16\", type:\"artefato\", title:\"Protótipo: classificador de tickets com LLM + RAG sobre uma base de FAQ\", res:\"GenAI for Beginners\", url:\"https://github.com/microsoft/generative-ai-for-beginners\", h:4},\n      ]},\n      {n:8, phase:2, focus:\"Cloud e segurança\", goal:\"Tech spec do agente de triagem com arquitetura, custo e riscos (P2).\", work:\"Pergunte ao engenheiro responsável quanto custa a infra do produto por mês e o que dobraria a conta. Peça revisão da tech spec.\", tasks:[\n        {id:\"t17\", type:\"estudo\", title:\"AWS Skill Builder, Cloud Practitioner Essentials (EC2, S3, RDS, Lambda, SQS, IAM)\", res:\"AWS Skill Builder\", url:\"https://skillbuilder.aws\", h:4},\n        {id:\"t18\", type:\"leitura\", title:\"OWASP Top 10: nomear os 10 riscos e um exemplo de feature que toca em cada\", res:\"OWASP\", url:\"https://owasp.org/www-project-top-ten/\", h:1},\n        {id:\"t19\", type:\"artefato\", title:\"Tech spec do agente de triagem: arquitetura, estimativa de custo, risk register (LGPD, alucinação, latência)\", res:\"ADR\", url:\"https://adr.github.io\", h:2.5},\n      ]},\n      {n:9, phase:3, focus:\"Shipping\", goal:\"portfolio-api no ar com Docker, testes e CI verde (P3).\", work:\"Acompanhe um deploy real do time do início ao fim. Anote cada etapa e quanto tempo levou.\", tasks:[\n        {id:\"t20\", type:\"estudo\", title:\"Docker, Get Started (tutorial oficial)\", res:\"Docker\", url:\"https://docs.docker.com/get-started/\", h:2},\n        {id:\"t21\", type:\"artefato\", title:\"portfolio-api: FastAPI + testes + Dockerfile + GitHub Actions + deploy em free tier + README com ADRs\", res:\"FastAPI\", url:\"https://fastapi.tiangolo.com\", h:5},\n      ]},\n      {n:10, phase:3, focus:\"Evals de IA\", goal:\"Agente de triagem medido: acurácia, custo e latência por versão (P4).\", work:\"Proponha ao time um eval mínimo para uma feature ou automação existente: 20 casos, uma métrica, um threshold.\", tasks:[\n        {id:\"t22\", type:\"estudo\", title:\"promptfoo: setup do primeiro eval\", res:\"promptfoo\", url:\"https://www.promptfoo.dev\", h:1.5},\n        {id:\"t23\", type:\"artefato\", title:\"Eval harness (dataset rotulado, 2 a 3 modelos, 2 a 3 prompts) + painel de custo, latência e acurácia + guardrails de PII\", res:\"promptfoo\", url:\"https://www.promptfoo.dev\", h:5},\n      ]},\n      {n:11, phase:3, focus:\"Dados\", goal:\"product-analytics-olist com queries, dashboard e PM memo (P5).\", work:\"Use uma das queries do P5 como modelo para uma pergunta real do produto e apresente o resultado numa reunião.\", tasks:[\n        {id:\"t24\", type:\"estudo\", title:\"Mode SQL Tutorial, nível Intermediate (window functions)\", res:\"Mode SQL\", url:\"https://mode.com/sql-tutorial\", h:2},\n        {id:\"t25\", type:\"artefato\", title:\"8 queries de PM sobre o dataset Olist (funil, atraso × review, cohort) + dashboard + PM memo de 1 página\", res:\"Dataset Olist\", url:\"https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce\", h:5},\n      ]},\n      {n:12, phase:3, focus:\"Consolidação\", goal:\"4 repos fixados, site atualizado, primeiro post técnico publicado.\", work:\"Use as decisões dos projetos como cases numa conversa com seu gestor ou numa entrevista. Refaça o checklist.\", tasks:[\n        {id:\"t26\", type:\"artefato\", title:\"Fixar os 4 repos, adicionar 'Technical work' ao site e publicar o primeiro post técnico no LinkedIn\", res:\"eraldoneto.com\", url:\"https://eraldoneto.com\", h:3},\n        {id:\"t27\", type:\"artefato\", title:\"Design doc #3: rate limiter (algoritmos, onde fica, trade-offs)\", res:\"System Design Primer\", url:\"https://github.com/donnemartin/system-design-primer\", h:2},\n        {id:\"t28\", type:\"prática\", title:\"Refazer a autoavaliação Tech PM (revisão da semana 12)\", res:\"Autoavaliação\", url:\"\", h:0.5},\n      ]},\n    ],\n    projects: [\n      {id:\"P1\", repo:\"system-design-notebook\", proves:\"Você lê e desenha sistemas.\", items:[\n        {id:\"d1\", t:\"Repositório criado com README explicando o propósito\", w:1},\n        {id:\"d2\", t:\"Notas por módulo com diagramas Mermaid\", w:2},\n        {id:\"d3\", t:\"Design doc #1: encurtador de URL\", w:3},\n        {id:\"d4\", t:\"Design doc #2: sistema de notificações\", w:4},\n        {id:\"d5\", t:\"Design doc #3: rate limiter\", w:12},\n      ]},\n      {id:\"P2\", repo:\"tech-pm-spec-kit\", proves:\"Você escreve o artefato que engenheiro confia.\", items:[\n        {id:\"d6\", t:\"Contrato OpenAPI do agente de triagem\", w:5},\n        {id:\"d7\", t:\"PRD com métricas e plano de evals\", w:6},\n        {id:\"d8\", t:\"Tech spec com arquitetura, custo e risk register\", w:8},\n        {id:\"d9\", t:\"Templates reutilizáveis: PRD, tech spec, ADR, eval plan\", w:8},\n      ]},\n      {id:\"P3\", repo:\"portfolio-api\", proves:\"Você entende build, test e deploy de ponta a ponta.\", items:[\n        {id:\"d10\", t:\"API FastAPI com docs OpenAPI e testes\", w:9},\n        {id:\"d11\", t:\"Dockerfile e CI verde no GitHub Actions\", w:9},\n        {id:\"d12\", t:\"Deploy no ar e README com ADRs\", w:9},\n      ]},\n      {id:\"P4\", repo:\"support-triage-agent\", proves:\"Você constrói e mede produto de IA. Projeto estrela.\", items:[\n        {id:\"d13\", t:\"Protótipo: classificador + RAG rodando local\", w:7},\n        {id:\"d14\", t:\"Eval harness com dataset rotulado\", w:10},\n        {id:\"d15\", t:\"Painel de custo, latência e acurácia + guardrails de PII\", w:10},\n      ]},\n      {id:\"P5\", repo:\"product-analytics-olist\", proves:\"Você tira insight do dado sem pedir a ninguém.\", items:[\n        {id:\"d16\", t:\"8 queries respondendo perguntas de PM\", w:11},\n        {id:\"d17\", t:\"Dashboard (Metabase ou Streamlit)\", w:11},\n        {id:\"d18\", t:\"PM memo com 3 decisões e trade-offs\", w:11},\n      ]},\n    ],\n    resources: [\n      {id:\"r1\", skill:\"Engenharia e entrega\", name:\"GitHub Skills\", url:\"https://skills.github.com\", when:\"Semana 1\"},\n      {id:\"r13\", skill:\"Engenharia e entrega\", name:\"Docker: Get Started\", url:\"https://docs.docker.com/get-started/\", when:\"Semana 9\"},\n      {id:\"r14\", skill:\"Engenharia e entrega\", name:\"FastAPI (documentação)\", url:\"https://fastapi.tiangolo.com\", when:\"Semana 9\"},\n      {id:\"r2\", skill:\"System design\", name:\"freeCodeCamp: Learn Software System Design\", url:\"https://www.freecodecamp.org/news/learn-software-system-design/\", when:\"Semanas 2 e 3\"},\n      {id:\"r3\", skill:\"System design\", name:\"System Design Primer (referência)\", url:\"https://github.com/donnemartin/system-design-primer\", when:\"Semanas 2, 3 e 12\"},\n      {id:\"r4\", skill:\"System design\", name:\"C4 Model + ADR\", url:\"https://c4model.com\", when:\"Semanas 3 e 4\"},\n      {id:\"r5\", skill:\"Dados e SQL\", name:\"SQLBolt\", url:\"https://sqlbolt.com\", when:\"Semana 4\"},\n      {id:\"r16\", skill:\"Dados e SQL\", name:\"Mode SQL Tutorial\", url:\"https://mode.com/sql-tutorial\", when:\"Semana 11\"},\n      {id:\"r17\", skill:\"Dados e SQL\", name:\"Dataset Olist (Kaggle)\", url:\"https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce\", when:\"Semana 11\"},\n      {id:\"r6\", skill:\"Escrita técnica\", name:\"Google Technical Writing One\", url:\"https://developers.google.com/tech-writing\", when:\"Semana 4\"},\n      {id:\"r7\", skill:\"APIs\", name:\"OpenAPI + Swagger Editor\", url:\"https://editor.swagger.io\", when:\"Semana 5\"},\n      {id:\"r8\", skill:\"Produto de IA\", name:\"HelloPM: Free AI Product Management Course\", url:\"https://hellopm.co/free/\", when:\"Semana 6\"},\n      {id:\"r9\", skill:\"Produto de IA\", name:\"Hamel Husain: Your AI Product Needs Evals\", url:\"https://hamel.dev/blog/posts/evals/\", when:\"Semana 6\"},\n      {id:\"r10\", skill:\"Produto de IA\", name:\"Microsoft: Generative AI for Beginners\", url:\"https://github.com/microsoft/generative-ai-for-beginners\", when:\"Semana 7\"},\n      {id:\"r15\", skill:\"Produto de IA\", name:\"promptfoo\", url:\"https://www.promptfoo.dev\", when:\"Semana 10\"},\n      {id:\"r11\", skill:\"Cloud\", name:\"AWS Skill Builder: Cloud Practitioner Essentials\", url:\"https://skillbuilder.aws\", when:\"Semana 8\"},\n      {id:\"r12\", skill:\"Segurança\", name:\"OWASP Top 10\", url:\"https://owasp.org/www-project-top-ten/\", when:\"Semana 8\"},\n    ],\n    reserve: [\n      {name:\"ByteByteGo (YouTube)\", url:\"https://www.youtube.com/@ByteByteGo\", why:\"manutenção semanal de system design em vídeos de 10 min\"},\n      {name:\"Anthropic courses (GitHub)\", url:\"https://github.com/anthropics/courses\", why:\"se quiser ir mais fundo em prompt engineering e tool use\"},\n      {name:\"Hugging Face Agents Course\", url:\"https://huggingface.co/learn/agents-course\", why:\"se o P4 pedir agentes com ferramentas\"},\n      {name:\"Postman Academy\", url:\"https://academy.postman.com\", why:\"se sentir falta de prática em testar APIs\"},\n      {name:\"AWS Well-Architected\", url:\"https://aws.amazon.com/architecture/well-architected/\", why:\"checklist para revisar a tech spec da semana 8\"},\n      {name:\"Metabase\", url:\"https://www.metabase.com\", why:\"dashboard do P5 em 10 minutos via Docker\"},\n    ],\n    checklist: [\n      \"Desenho em 10 minutos a arquitetura do produto que gerencio\",\n      \"Leio um PR e entendo o que muda e o que pode quebrar\",\n      \"Escrevo tech spec com alternativas, trade-offs e não-objetivos\",\n      \"Sei o custo de infra do meu produto e o que o dobra\",\n      \"Rodo SQL para responder minha própria pergunta antes de pedir ao time de dados\",\n      \"Explico por que uma feature de IA falha e como medir isso (evals, abstenção, custo/latência)\",\n      \"Leio um contrato OpenAPI e aponto o que falta (versionamento, erros, paginação, auth)\",\n      \"Nomeio os 3 maiores riscos técnicos do roadmap e o plano de mitigação de cada um\",\n      \"Reconheço quando uma feature toca no OWASP Top 10 ou em base legal da LGPD\",\n      \"Sei as 4 métricas DORA do meu time e o que faria para melhorar a pior delas\",\n    ],\n    reviews: [\"Semana 0\", \"Semana 4\", \"Semana 8\", \"Semana 12\"],\n  };\n\n  constructor(p){\n    super(p);\n    this.state = {view:\"painel\", openWeek:null, toast:\"\", jsonText:\"\", ckCol:null, d:this.load()};\n  }\n  blank(){ return {startDate:\"2026-09-07\", goal:6, tasks:{}, deliverables:{}, resources:{}, checklist:{}, notes:{}, savedAt:null}; }\n  load(){\n    try{ const raw = localStorage.getItem(this.KEY); return Object.assign(this.blank(), raw ? JSON.parse(raw) : null); }\n    catch(e){ return this.blank(); }\n  }\n  persist(d){\n    const nd = d || this.state.d;\n    nd.savedAt = new Date().toISOString();\n    try{ localStorage.setItem(this.KEY, JSON.stringify(nd)); }catch(e){}\n    this.setState({d: Object.assign({}, nd)});\n  }\n  toast(msg){\n    this.setState({toast: msg});\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({toast: \"\"}), 2400);\n  }\n  go(view, week){\n    const s = {view};\n    if(week) s.openWeek = week;\n    this.setState(s);\n    window.scrollTo(0, 0);\n  }\n\n  sd(){ const p = String(this.state.d.startDate || \"2026-09-07\").split(\"-\").map(Number); return new Date(p[0], p[1]-1, p[2]); }\n  ws(n){ return new Date(this.sd().getTime() + (n-1)*7*this.DAY); }\n  we(n){ return new Date(this.ws(n).getTime() + 6*this.DAY); }\n  todayD(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }\n  cw(){ const diff = Math.floor((this.todayD() - this.sd())/this.DAY); if(diff < 0) return 0; return Math.min(13, Math.floor(diff/7)+1); }\n  fmtDate(d, y){ const o = {day:\"2-digit\", month:\"short\"}; if(y) o.year = \"numeric\"; return d.toLocaleDateString(\"pt-BR\", o).replace(/\\./g, \"\"); }\n  range(n){ return this.fmtDate(this.ws(n)) + \" – \" + this.fmtDate(this.we(n)); }\n  fmtH(h){ return (Math.round(h*10)/10).toString().replace(\".\", \",\") + \" h\"; }\n  pct(x){ return Math.round(x*100) + \"%\"; }\n\n  tk(id){ return this.state.d.tasks[id] || {status:0, hours:0, link:\"\"}; }\n  setTask(id, patch){ const d = this.state.d; d.tasks[id] = Object.assign({}, this.tk(id), patch); this.persist(d); }\n  dl(id){ return this.state.d.deliverables[id] || {done:false, link:\"\"}; }\n  setDeliv(id, patch){ const d = this.state.d; d.deliverables[id] = Object.assign({}, this.dl(id), patch); this.persist(d); }\n\n  weekStats(w){\n    let done=0, planned=0, logged=0;\n    w.tasks.forEach(t => { const s = this.tk(t.id); if(s.status===2) done++; planned += t.h; logged += Number(s.hours)||0; });\n    const total = w.tasks.length;\n    return {done, total, planned, logged, pct: total ? done/total : 0};\n  }\n  allStats(){\n    let done=0, total=0, planned=0, logged=0;\n    this.PLAN.weeks.forEach(w => { const s = this.weekStats(w); done+=s.done; total+=s.total; planned+=s.planned; logged+=s.logged; });\n    return {done, total, planned, logged, pct: total ? done/total : 0};\n  }\n  projStats(p){ const done = p.items.filter(i => this.dl(i.id).done).length; return {done, total:p.items.length, pct: p.items.length ? done/p.items.length : 0}; }\n  weekState(n){\n    const s = this.weekStats(this.PLAN.weeks[n-1]);\n    if(s.pct === 1) return \"done\";\n    if(n === this.cw()) return \"now\";\n    if(n < this.cw()) return \"late\";\n    return \"\";\n  }\n  ckScore(col){\n    let s = 0;\n    this.PLAN.checklist.forEach((_, i) => { const v = (this.state.d.checklist[i]||{})[col]; if(v===\"Sim\") s+=1; else if(v===\"Parcial\") s+=0.5; });\n    return s / this.PLAN.checklist.length;\n  }\n\n  taskVM(t){\n    const s = this.tk(t.id), done = s.status===2;\n    const base = \"width:24px;height:24px;border-radius:50%;padding:0;margin-top:1px;cursor:pointer;display:grid;place-items:center;transition:transform .12s;\";\n    const dot = done ? base+\"border:0;background:#5B5BD6\"\n      : s.status===1 ? base+\"border:2px solid #5B5BD6;background:linear-gradient(90deg,#5B5BD6 50%,#fff 50%)\"\n      : base+\"border:2px solid #DCDEE8;background:#fff\";\n    const tagBase = \"font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;\";\n    const tag = t.type===\"artefato\" ? tagBase+\"background:#EFEFFC;color:#5251C9\"\n      : t.type===\"prática\" ? tagBase+\"background:#E8F5F0;color:#12886A\"\n      : t.type===\"leitura\" ? tagBase+\"background:#FCF2E5;color:#B57A28\"\n      : tagBase+\"background:#F1F2F7;color:#6B7080\";\n    return {\n      title: t.title, type: t.type, res: t.res, url: t.url, hasUrl: !!t.url,\n      hPrev: this.fmtH(t.h), hours: s.hours || \"\", link: s.link || \"\",\n      done, statusLabel: this.STATUS[s.status], dot, tagStyle: tag,\n      titleStyle: done ? \"font-size:15px;font-weight:500;line-height:1.5;color:#A4A8B6;text-decoration:line-through\" : \"font-size:15px;font-weight:500;line-height:1.5;color:#191B28\",\n      cycle: () => this.setTask(t.id, {status: (this.tk(t.id).status+1)%3}),\n      onHours: e => this.setTask(t.id, {hours: Number(e.target.value)||0}),\n      onLink: e => this.setTask(t.id, {link: e.target.value}),\n    };\n  }\n\n  ring(p, size, track, fill, bg){\n    const deg = Math.round(p*360);\n    return \"position:relative;width:\"+size+\"px;height:\"+size+\"px;border-radius:50%;flex:0 0 auto;background:conic-gradient(\"+fill+\" \"+deg+\"deg, \"+track+\" \"+deg+\"deg)\";\n  }\n\n  renderVals(){\n    const P = this.PLAN, d = this.state.d, v = this.state.view, cw = this.cw(), all = this.allStats();\n    const projDone = P.projects.reduce((a,p) => a + this.projStats(p).done, 0);\n    const projTotal = P.projects.reduce((a,p) => a + p.items.length, 0);\n    const weeksDone = P.weeks.filter(w => this.weekStats(w).pct === 1).length;\n\n    const navBase = \"border:0;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;\";\n    const nav = [[\"painel\",\"Painel\"],[\"semanas\",\"Trilha\"],[\"projetos\",\"Projetos\"],[\"recursos\",\"Recursos\"],[\"checklist\",\"Autoavaliação\"]]\n      .map(x => ({\n        label: x[1],\n        style: v===x[0] ? navBase+\"background:#EFEFFC;color:#4F4CC4\" : navBase+\"background:none;color:#6B7080\",\n        go: () => this.go(x[0]),\n      }));\n\n    let eyebrow, title, sub;\n    if(cw === 0){ eyebrow = \"Começa em \" + this.fmtDate(this.sd(), true); title = \"Tudo pronto para começar\"; sub = \"Reserve os blocos de estudo na agenda e responda a autoavaliação da semana 0 — é ela que mostra o quanto você evoluiu no fim.\"; }\n    else if(cw === 13){ eyebrow = \"Trilha concluída\"; title = \"12 semanas percorridas\"; sub = \"Refaça a autoavaliação e compare com a semana 0.\"; }\n    else { const w = P.weeks[cw-1]; eyebrow = \"Semana \" + cw + \" de 12 · \" + this.range(cw); title = w.focus; sub = w.goal; }\n\n    const fw = (cw >= 1 && cw <= 12) ? cw : 1;\n    const fwk = P.weeks[fw-1];\n\n    const chipBase = \"width:100%;aspect-ratio:1;min-height:34px;border-radius:12px;border:0;cursor:pointer;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0;\";\n    const chips = P.weeks.map(w => {\n      const s = this.weekStats(w), st = this.weekState(w.n);\n      const style = st===\"done\" ? chipBase+\"background:#fff;color:#4F4CC4\"\n        : st===\"now\" ? chipBase+\"background:rgba(255,255,255,.3);color:#fff;box-shadow:inset 0 0 0 2px #fff\"\n        : st===\"late\" ? chipBase+\"background:rgba(255,255,255,.16);color:rgba(255,255,255,.9)\"\n        : chipBase+\"background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)\";\n      return {n: w.n, style, title: \"Semana \" + w.n + \": \" + w.focus + \" — \" + s.done + \" de \" + s.total, go: () => this.go(\"semanas\", w.n)};\n    });\n\n    const barFill = (p, done) => \"display:block;height:100%;border-radius:3px;background:\" + (done ? \"#15A47A\" : \"#5B5BD6\") + \";width:\" + this.pct(p);\n    const badge = (done) => \"font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;\" + (done ? \"background:#E8F5F0;color:#12886A\" : \"background:#EFEFFC;color:#5251C9\");\n\n    const phaseBars = P.phases.map(ph => {\n      let done=0, total=0;\n      P.weeks.filter(w => w.phase===ph.n).forEach(w => { const s = this.weekStats(w); done+=s.done; total+=s.total; });\n      const p = total ? done/total : 0;\n      return {name: ph.name, count: done + \"/\" + total, fill: barFill(p, p===1)};\n    });\n    const projBars = P.projects.map(p => { const s = this.projStats(p); return {repo:p.repo, count:s.done + \"/\" + s.total, fill: barFill(s.pct, s.pct===1)}; });\n\n    const lastReview = [3,2,1,0].find(i => P.checklist.some((_, k) => (d.checklist[k]||{})[i]));\n    const ckSummary = lastReview === undefined ? \"Você ainda não respondeu. Comece pela coluna Semana 0.\" : P.reviews[lastReview] + \": \" + this.pct(this.ckScore(lastReview)) + \" dos itens.\";\n\n    const weeks = P.weeks.map(w => {\n      const s = this.weekStats(w), st = this.weekState(w.n);\n      const open = this.state.openWeek ? this.state.openWeek===w.n : w.n===fw;\n      const pillBase = \"font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;\";\n      return {\n        n: w.n, focus: w.focus, goal: w.goal, work: w.work, range: this.range(w.n), open,\n        count: s.done + \"/\" + s.total, fill: barFill(s.pct, s.pct===1),\n        pill: st===\"now\" ? \"agora\" : st===\"late\" ? \"pendente\" : st===\"done\" ? \"concluída\" : \"\",\n        pillStyle: st===\"now\" ? pillBase+\"background:#5B5BD6;color:#fff\" : st===\"late\" ? pillBase+\"background:#FCF2E5;color:#B57A28\" : pillBase+\"background:#E8F5F0;color:#12886A\",\n        cardStyle: \"background:#fff;border:1px solid \" + (st===\"now\" ? \"#D6D6F7\" : \"#EDEEF4\") + \";border-radius:20px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(25,27,40,.04)\",\n        numStyle: \"width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:16px;font-weight:700;letter-spacing:-.02em;\" + (st===\"done\" ? \"background:#E8F5F0;color:#12886A\" : st===\"now\" ? \"background:#5B5BD6;color:#fff\" : \"background:#F4F5F9;color:#9498A8\"),\n        tasks: w.tasks.map(t => this.taskVM(t)),\n        note: d.notes[w.n] || \"\",\n        onNote: e => { const nd = this.state.d; nd.notes[w.n] = e.target.value; this.persist(nd); },\n        toggle: () => this.setState({openWeek: open ? -1 : w.n}),\n      };\n    });\n\n    const projects = P.projects.map(p => {\n      const s = this.projStats(p);\n      return {\n        repo: p.repo, proves: p.proves, count: s.done + \"/\" + s.total, badge: badge(s.pct===1), fill: barFill(s.pct, s.pct===1),\n        items: p.items.map(i => {\n          const st = this.dl(i.id);\n          return {\n            t: i.t, w: i.w, done: st.done, link: st.link || \"\",\n            labelStyle: st.done ? \"font-size:14px;color:#A4A8B6;text-decoration:line-through\" : \"font-size:14px;color:#191B28\",\n            toggle: e => this.setDeliv(i.id, {done: e.target.checked}),\n            onLink: e => this.setDeliv(i.id, {link: e.target.value}),\n          };\n        }),\n      };\n    });\n\n    const skills = [];\n    P.resources.forEach(r => { if(skills.indexOf(r.skill) < 0) skills.push(r.skill); });\n    const selBase = \"border:1px solid #E7E8EF;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;\";\n    const resGroups = skills.map(sk => ({\n      skill: sk,\n      items: P.resources.filter(r => r.skill===sk).map(r => {\n        const st = d.resources[r.id] || \"Não iniciado\";\n        return {\n          name: r.name, url: r.url, when: r.when, status: st,\n          style: st===\"Concluído\" ? selBase+\"background:#E8F5F0;color:#12886A;border-color:#D3EBE2\" : st===\"Em uso\" ? selBase+\"background:#EFEFFC;color:#5251C9;border-color:#E0E0F8\" : selBase+\"background:#FAFAFD;color:#8C90A0\",\n          onChange: e => { const nd = this.state.d; nd.resources[r.id] = e.target.value; this.persist(nd); },\n        };\n      }),\n    }));\n\n    const ckCol = this.state.ckCol === null ? (cw < 4 ? 0 : cw < 8 ? 1 : cw < 12 ? 2 : 3) : this.state.ckCol;\n    const tabBase = \"border:0;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;\";\n    const ckTabs = P.reviews.map((r, i) => ({\n      label: r,\n      style: i===ckCol ? tabBase+\"background:#fff;color:#4F4CC4;box-shadow:0 1px 3px rgba(25,27,40,.1)\" : tabBase+\"background:none;color:#8C90A0\",\n      go: () => this.setState({ckCol: i}),\n    }));\n    const optBase = \"border:0;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;\";\n    const optColor = {\"Sim\":\"background:#15A47A;color:#fff\", \"Parcial\":\"background:#E0A335;color:#fff\", \"Não\":\"background:#DDDFE8;color:#4C5162\"};\n    const ckItems = P.checklist.map((item, i) => {\n      const val = (d.checklist[i]||{})[ckCol] || \"\";\n      return {\n        item,\n        opts: [\"Sim\", \"Parcial\", \"Não\"].map(o => ({\n          label: o,\n          style: val===o ? optBase+optColor[o] : optBase+\"background:none;color:#9498A8\",\n          pick: () => { const nd = this.state.d; nd.checklist[i] = Object.assign({}, nd.checklist[i]); nd.checklist[i][ckCol] = val===o ? \"\" : o; this.persist(nd); },\n        })),\n      };\n    });\n\n    return {\n      nav, isPainel: v===\"painel\", isSemanas: v===\"semanas\", isProjetos: v===\"projetos\",\n      isRecursos: v===\"recursos\", isChecklist: v===\"checklist\", isAjustes: v===\"ajustes\",\n      showHours: this.props.showHours === true,\n      showWorkPrompt: this.props.showWorkPrompt !== false,\n      showReserve: this.props.showReserve !== false,\n      goAjustes: () => this.go(\"ajustes\"), goSemanas: () => this.go(\"semanas\"), goChecklist: () => this.go(\"checklist\"),\n      goFocusWeek: () => this.go(\"semanas\", fw),\n      ctaLabel: cw >= 1 && cw <= 12 ? \"Continuar a semana \" + cw : \"Abrir a semana 1\",\n      eyebrow, title, sub, chips,\n      overallPct: this.pct(all.pct),\n      ringStyle: this.ring(all.pct, 116, \"rgba(255,255,255,.22)\", \"#fff\"),\n      phaseLabels: P.phases.map(p => ({label: p.name})),\n      stats: [\n        {l: \"Tarefas concluídas\", v: all.done + \"/\" + all.total, badge: badge(all.pct===1), fill: barFill(all.pct, all.pct===1)},\n        {l: \"Semanas fechadas\", v: weeksDone + \"/12\", badge: badge(weeksDone===12), fill: barFill(weeksDone/12, weeksDone===12)},\n        {l: \"Entregáveis no portfólio\", v: projDone + \"/\" + projTotal, badge: badge(projDone===projTotal), fill: barFill(projTotal ? projDone/projTotal : 0, projDone===projTotal)},\n      ],\n      focusLabel: cw>=1 && cw<=12 ? \"Continue de onde parou\" : \"Comece por aqui\",\n      focusRange: this.range(fw), focusGoal: fwk.goal, focusWork: fwk.work,\n      focusTasks: fwk.tasks.map(t => this.taskVM(t)),\n      phaseBars, projBars, ckSummary,\n      weeks, projects, resGroups, reserve: P.reserve,\n      ckTabs, ckItems, ckColLabel: P.reviews[ckCol], ckPct: this.pct(this.ckScore(ckCol)),\n      ckRingStyle: this.ring(this.ckScore(ckCol), 62, \"#EFF0F5\", \"#5B5BD6\"),\n      ckHistory: P.reviews.map((r, i) => ({label: r, pct: this.pct(this.ckScore(i))})),\n      startDate: d.startDate, goal: d.goal, jsonText: this.state.jsonText, toast: this.state.toast,\n      savedAt: d.savedAt ? \"Salvo às \" + new Date(d.savedAt).toLocaleString(\"pt-BR\", {day:\"2-digit\", month:\"2-digit\", hour:\"2-digit\", minute:\"2-digit\"}) : \"Nada salvo ainda neste navegador.\",\n      onStart: e => { if(e.target.value){ const nd = this.state.d; nd.startDate = e.target.value; this.persist(nd); } },\n      onGoal: e => { const nd = this.state.d; nd.goal = Number(e.target.value)||6; this.persist(nd); },\n      onJson: e => this.setState({jsonText: e.target.value}),\n      onExport: () => {\n        const txt = JSON.stringify(this.state.d, null, 2);\n        this.setState({jsonText: txt});\n        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => this.toast(\"Backup copiado\"), () => this.toast(\"Backup exibido abaixo\"));\n        else this.toast(\"Backup exibido abaixo\");\n      },\n      onImport: () => {\n        try{\n          const s = JSON.parse(this.state.jsonText);\n          if(!s || typeof s !== \"object\" || !(\"tasks\" in s)) throw new Error(\"formato\");\n          this.persist(Object.assign(this.blank(), s));\n          this.toast(\"Progresso restaurado\");\n        }catch(err){ this.toast(\"Não foi possível ler o backup\"); }\n      },\n      onReset: () => {\n        if(confirm(\"Apagar todo o progresso salvo neste navegador? Esta ação não tem volta.\")){\n          try{ localStorage.removeItem(this.KEY); }catch(e){}\n          this.setState({d: this.blank()});\n          this.toast(\"Progresso apagado\");\n        }\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
